name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_CONFIG: |
    extra-substituters = https://nix-community.cachix.org https://noctalia.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

jobs:
  guard:
    name: Personal layer guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Block personal host changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'personal-layer') }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          files=$(git diff --name-only "$BASE_SHA"... "$HEAD_SHA" || git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
          personal=$(echo "$files" | grep -E '^hosts/' || true)
          if [ -n "$personal" ] && [ "$ALLOWED" != 'true' ]; then
            {
              echo "This PR touches personal hosts:"
              echo "$personal"
              echo ""
              echo "Each host is an atomic personal unit — keep hosts in your fork"
              echo "(see CONTRIBUTING.md, 'Fork contract'). A maintainer may still merge this by"
              echo "adding the 'personal-layer' label."
            } >&2
            exit 1
          fi

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop --accept-flake-config --command alejandra --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop --accept-flake-config --command sh -c "statix check . && deadnix --fail ."

  check:
    name: Evaluation
    needs: [format, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix flake check --accept-flake-config

  discover:
    name: Hosts
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - id: hosts
        run: echo "hosts=$(nix eval --accept-flake-config --json .#nixosConfigurations --apply 'builtins.attrNames')" >> "$GITHUB_OUTPUT"

  init-golden:
    name: hamra-init golden
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop --accept-flake-config --command bash scripts/tests/test_golden.sh

  build:
    name: Build ${{ matrix.host }}
    needs: [check, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix build --accept-flake-config --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Push closures to cachix
        if: env.CACHIX_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: hamra
          authToken: ${{ env.CACHIX_TOKEN }}

  apps:
    name: Apps smoke test (cookiecutter)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix run --accept-flake-config .#cookiecutter -- --help
      - name: Push apps to cachix
        if: env.CACHIX_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: hamra
          authToken: ${{ env.CACHIX_TOKEN }}
