name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    extra-substituters = https://nix-community.cachix.org https://noctalia.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

jobs:
  format:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop --command alejandra --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop --command sh -c "statix check . && deadnix ."

  check:
    name: Avaliação
    needs: [format, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix flake check

  discover:
    name: Hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - id: hosts
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply 'builtins.attrNames')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.host }}
    needs: [check, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Push closures to cachix
        if: env.CACHIX_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: hamra
          authToken: ${{ env.CACHIX_TOKEN }}
