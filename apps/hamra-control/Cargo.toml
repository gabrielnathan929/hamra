[package]
name = "hamra-control"
version = "0.1.0"
edition = "2021"
description = "Hamra Control Center — manage your NixOS machines visually"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
